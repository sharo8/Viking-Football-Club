services:
  mysql:
    image: mysql:8.4
    container_name: vikingfc-mysql
    environment:
      MYSQL_DATABASE: vikingfc
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sharO123}
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - vikingfc_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-sharO123}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vikingfc_mysql:
