spring:
  mail:
    username: ${MAIL_SMTP_USERNAME:internshipsolvitafrica@gmail.com}
    password: ${MAIL_SMTP_PASSWORD:}
  datasource:
    url: jdbc:h2:file:./data/vikingfc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
