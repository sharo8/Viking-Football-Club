spring:
  application:
    name: viking-fc
  profiles:
    active: dev
  jackson:
    time-zone: Africa/Kigali
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Africa/Kigali
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      identity: BIGINT GENERATED BY DEFAULT AS IDENTITY
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  thymeleaf:
    check-template-location: false
  mail:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Viking FC
    motto: ONE CLUB | ONE FAMILY | ONE MISSION
    season: 2026/2027
    currency: RWF

app:
  bootstrap-derived-data: true
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-viking-fc-jwt-secret-key-2026-min-32b}
    access-minutes: ${JWT_ACCESS_MINUTES:480}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  security:
    max-failed-attempts: 5
    lock-minutes: 15
    login-requests-per-minute: 20
  mail:
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:Viking FC}
    frontend-base-url: ${MAIL_FRONTEND_BASE_URL:http://localhost:3000}
    enabled: ${MAIL_ENABLED:true}
  errors:
    expose-details: ${EXPOSE_ERROR_DETAILS:false}

logging:
  level:
    rw.vikingfc: INFO
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
