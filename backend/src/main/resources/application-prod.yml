server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
      data-source-properties:
        characterEncoding: UTF-8
        serverTimezone: Africa/Kigali
        tinyInt1isBit: true
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        globally_quoted_identifiers: true
  flyway:
    placeholders:
      identity: BIGINT NOT NULL AUTO_INCREMENT
  mail:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_SMTP_HOST:smtp.gmail.com}
            protocols: TLSv1.2

app:
  bootstrap-derived-data: false
  cors:
    origins: ${CORS_ORIGINS:https://viking-football-club.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_SMTP_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Viking FC}
    frontend-base-url: ${MAIL_FRONTEND_BASE_URL:https://viking-football-club.vercel.app}
    enabled: ${MAIL_ENABLED:true}
