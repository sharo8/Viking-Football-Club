<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Player | Viking FC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../logo/viking-fc.png" />
  <script>(function(){var t=localStorage.getItem("viking-theme")||"dark";var d=t==="dark";document.documentElement.classList.toggle("dark",d);document.documentElement.style.colorScheme=d?"dark":"light";})();</script>
</head>
<body>
  <div id="playerRoot"></div>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function initPage() {
      const player = PLAYERS.find((p) => p.slug === qs("slug"));
      const root = document.getElementById("playerRoot");
      if (!player) {
        root.innerHTML = `<section class="section" style="padding-top:8rem;text-align:center"><h1 class="heading-lg">Player not found</h1><a class="btn btn-primary mt-3" href="players.html">Back</a></section>`;
        return;
      }
      document.title = player.name + " | Viking FC";
      const stats = [
        ["Appearances", player.stats.appearances],
        ["Goals", player.stats.goals],
        ["Assists", player.stats.assists],
      ];
      if (player.stats.cleanSheets != null) stats.push(["Clean Sheets", player.stats.cleanSheets]);

      root.innerHTML = `
        <section class="detail-hero">
          <img class="detail-hero-bg" src="${asset(player.image)}" alt="" />
          <div class="container detail-grid">
            <img class="detail-photo" src="${asset(player.image)}" alt="${player.name}" />
            <div>
              <div class="font-display text-red" style="font-size:4.5rem;line-height:1">${player.number}</div>
              <h1 class="heading-lg">${player.name}</h1>
              <p class="text-gold mt-1" style="font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase">${player.position} · ${player.nationality}</p>
              <p class="mt-3" style="color:rgba(255,255,255,.75);max-width:520px">${player.bio}</p>
              <a class="read-more" href="players.html">← Back</a>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="container grid-2">
            <div>
              <h2 class="heading-lg mb-3">Profile</h2>
              <div class="grid-2">
                ${[
                  ["Number", player.number],["Position", player.position],["Nationality", player.nationality],
                  ["Age", player.age],["Height", player.height],["Weight", player.weight],["Date of Birth", player.dob]
                ].map(([l,v]) => `<div class="info-box"><span>${l}</span><strong>${v}</strong></div>`).join("")}
              </div>
            </div>
            <div>
              <h2 class="heading-lg mb-3">Statistics</h2>
              <div class="stats-row">
                ${stats.map(([l,v]) => `<div class="stat-box"><strong>${v}</strong><span>${l}</span></div>`).join("")}
              </div>
            </div>
          </div>
        </section>
        <section class="section bg-alt">
          <div class="container">
            <h2 class="heading-lg mb-3">Gallery</h2>
            <div class="gallery-grid">
              ${[player.image, IMAGES.pitch, IMAGES.run].map((img) => `
                <div class="gallery-item"><img src="${asset(img)}" alt="${player.name}" /></div>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }
  </script>
</body>
</html>
