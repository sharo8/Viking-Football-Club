<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>About | Viking FC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../logo/logo.png" />
</head>
<body>
  <section class="page-hero">
    <img src="../images/portrait.png" alt="" />
    <div class="container">
      <h1 class="heading-xl" data-i18n="pages.about.title">About Viking FC</h1>
      <p class="page-hero-sub" data-i18n="hero.slogan">One Club. One Family. One Dream.</p>
    </div>
    <div class="page-hero-scroll" aria-hidden="true">Scroll<span></span></div>
</section>

<section class="section">
    <div class="container">
      <div class="split">
        <img src="../images/squad.png" alt="" />
        <div>
          <p class="section-label" data-i18n="pages.about.history">Our History</p>
          <h2 class="heading-lg mb-2" data-i18n="pages.about.history">Our History</h2>
          <p class="text-muted" data-i18n="pages.about.historyText"></p>
        </div>
      </div>
      <div class="split reverse">
        <img src="../images/celebrate.png" alt="" />
        <div class="text-col">
          <p class="section-label" data-i18n="pages.about.vision">Our Vision</p>
          <h2 class="heading-lg mb-2" data-i18n="pages.about.vision">Our Vision</h2>
          <p class="text-muted" data-i18n="pages.about.visionText"></p>
        </div>
      </div>
      <div class="split">
        <img src="../images/pitch.png" alt="" />
        <div>
          <p class="section-label" data-i18n="pages.about.mission">Our Mission</p>
          <h2 class="heading-lg mb-2" data-i18n="pages.about.mission">Our Mission</h2>
          <p class="text-muted" data-i18n="pages.about.missionText"></p>
        </div>
      </div>
      <div class="split reverse">
        <img src="../images/jog.png" alt="" />
        <div class="text-col">
          <p class="section-label" data-i18n="pages.about.values">Our Values</p>
          <h2 class="heading-lg mb-2" data-i18n="pages.about.values">Our Values</h2>
          <p class="text-muted" data-i18n="pages.about.valuesText"></p>
        </div>
      </div>
    </div>
</section>

<section class="section bg-alt">
    <div class="container grid-2">
      <blockquote class="quote">
        <p class="section-label" data-i18n="pages.about.presidentWord">Word from the President</p>
        <p data-i18n="pages.about.presidentQuote"></p>
        <footer>Victor Jacker</footer>
      </blockquote>
      <blockquote class="quote gold">
        <p class="section-label" data-i18n="pages.about.managerWord">Word from the Manager</p>
        <p data-i18n="pages.about.managerQuote"></p>
        <footer>Coach Michel Nzeyimana</footer>
      </blockquote>
    </div>
</section>

<section class="section">
    <div class="container grid-2" style="align-items:center">
      <div>
        <p class="section-label" data-i18n="pages.about.stadium">The Stadium</p>
        <h2 class="heading-lg mb-2" data-i18n="pages.about.stadium">The Stadium</h2>
        <p class="text-muted mb-2" data-i18n="pages.about.stadiumText"></p>
      </div>
      <img src="../images/blue-kit.png" alt="Stadium" style="aspect-ratio:16/11;object-fit:cover;width:100%" />
    </div>
  </section>

  <section class="newsletter section">
    <img src="../images/stretch.png" alt="" />
    <div class="container" style="text-align:left;max-width:720px">
      <p class="section-label" data-i18n="pages.about.academy">Our Academy</p>
      <h2 class="heading-lg mb-2" data-i18n="pages.about.academy">Our Academy</h2>
      <p style="color:rgba(255,255,255,.8)" data-i18n="pages.about.academyText"></p>
    </div>
  </section>

  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
