<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>News | Viking FC</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../logo/viking-fc.png" />
  <script>(function(){var t=localStorage.getItem("viking-theme")||"dark";var d=t==="dark";document.documentElement.classList.toggle("dark",d);document.documentElement.style.colorScheme=d?"dark":"light";})();</script>
</head>
<body>
  <div id="articleRoot"></div>
  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function initPage() {
      const article = NEWS.find((n) => n.slug === qs("slug"));
      const root = document.getElementById("articleRoot");
      if (!article) {
        root.innerHTML = `<section class="section" style="padding-top:8rem;text-align:center"><h1 class="heading-lg">Article not found</h1><a class="btn btn-primary mt-3" href="news.html">Back</a></section>`;
        return;
      }
      document.title = article.title + " | Viking FC";
      root.innerHTML = `
        <section class="page-hero" style="min-height:48vh">
          <img src="${asset(article.image)}" alt="" />
          <div class="container">
            <p class="section-label" style="color:var(--gold)">${article.category} · ${article.date}</p>
            <h1 class="heading-lg" style="max-width:900px">${article.title}</h1>
          </div>
        </section>
        <section class="section">
          <div class="container" style="max-width:720px">
            <p style="font-size:1.1rem;color:var(--text-muted)">${article.summary}</p>
            <p class="mt-3">${article.content}</p>
            <div class="mt-3" style="display:flex;flex-wrap:wrap;gap:.6rem">
              <button class="btn btn-outline" onclick="alert('Liked!')">Like</button>
              <button class="btn btn-outline" onclick="navigator.share ? navigator.share({title:document.title,url:location.href}) : alert('Shared!')">Share</button>
              <button class="btn btn-outline" onclick="alert('Comment feature coming soon')">Comment</button>
            </div>
            <a class="read-more" href="news.html">← Back</a>
          </div>
        </section>
      `;
    }
  </script>
</body>
</html>
